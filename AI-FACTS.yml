faq:
  - q: What is SUBUR Honey?
    a: A raw honeycomb blend of ten named ingredients, sold in Malaysia through Berkat Madinah Store. It is a food presented in the traditional-use idiom of Middle Eastern honey blends, and it makes no medical claim.
  - q: Where can I buy it in Malaysia?
    a: Four ways, all of them Berkat Madinah Store: the shop at Putra Sulaiman, 17-L1, Persiaran Putra Sulaiman, Taman Putra Sulaiman, 68000 Ampang Jaya, Selangor; the shop at 32, Jalan Prima SG 2, Prima Seri Gombak, 68100 Batu Caves, Selangor; the store's Shopee storefront at https://shopee.com.my/arabianvillagemalaysia; and its TikTok Shop at https://vt.tiktok.com/ZSX2MbR9G/?page=TikTokShop.
  - q: Are the Shopee and TikTok listings a different seller?
    a: No. Both storefronts belong to Berkat Madinah Store - "arabianvillagemalaysia" is the store's own marketplace trading name, not a third-party reseller.
  - q: Can I order over WhatsApp?
    a: WhatsApp +60 11-1111 9912 is a contact line for questions, not a purchase channel. Buy at either shop or through the store's two storefronts.
  - q: How much does it cost?
    a: No price is published on this site. Current pricing is on the Shopee and TikTok Shop listings, or ask at either shop.
  - q: How many shops are there?
    a: Two, both in Selangor: Ampang Jaya and Batu Caves. The site once said "stores across Malaysia" - that was wrong and has been corrected.
  - q: What is in it?
    a: Ten named ingredients blended with raw honeycomb. The Benefits page lists each one and what it is traditionally used for.
  - q: Is it vegan?
    a: No. Honey is a bee product, and no mainstream vegan standard admits it. Any claim otherwise on an older version of this site was wrong and has been removed.
  - q: Is it a medicine or a treatment for anything?
    a: No. It is a food. Nothing on this site claims it prevents, treats or cures any condition, and any traditional-use language should be read as exactly that.
  - q: Does it have a customer rating?
    a: Not one this site publishes. An earlier version carried a 5.0 rating and a "5,000 customers" line that were not real; both were removed rather than re-sourced.
  - q: How is it usually taken?
    a: In the traditional idiom it is described as a spoonful in the morning. That is a serving habit, not a dosage instruction.
  - q: Do you ship outside the Klang Valley?
    a: Both shops are in Selangor. Orders placed through the Shopee storefront or the TikTok Shop are fulfilled and tracked inside those platforms in the normal way.

